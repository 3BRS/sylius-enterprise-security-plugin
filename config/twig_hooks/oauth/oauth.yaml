sylius_twig_hooks:
    hooks:
        'sylius_shop.account.login.content.login_container':
            three_brs_social_login:
                template: '@ThreeBRSSyliusEnterpriseSecurityPlugin/Shop/OAuth/login_buttons.html.twig'
                priority: 50

        'sylius_shop.account.register.content':
            three_brs_social_login:
                template: '@ThreeBRSSyliusEnterpriseSecurityPlugin/Shop/OAuth/login_buttons.html.twig'
                priority: -100

        'sylius_admin.security.login.page.content':
            three_brs_social_login:
                template: '@ThreeBRSSyliusEnterpriseSecurityPlugin/Admin/OAuth/login_buttons.html.twig'
                priority: -100
