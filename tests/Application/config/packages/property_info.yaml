# api-platform 4.3.x nested-IRI workaround (see README §Troubleshooting).
#
# api-platform's constructor property-info extractor (registered by the Symfony
# recipe / the default in Symfony 8.0) runs BEFORE the Doctrine extractor and
# resolves relation properties such as Image::$owner to a bare `object` from
# their `@var object|null` PHPDoc, shadowing the concrete Doctrine type. That
# breaks nested IRI generation (e.g. /shop/products/{code}/images/{id}).
#
# Disabling it lets the Doctrine extractor win for relations; it is the Symfony
# default and is unnecessary here. Remove once the upstream api-platform 4.3.x
# regression is fixed.
framework:
    property_info:
        with_constructor_extractor: false
