security:
    providers:
        sylius_admin_user_provider:
            id: sylius.admin_user_provider.email_or_name_based
        sylius_api_admin_user_provider:
            id: sylius.admin_user_provider.email_or_name_based
        sylius_shop_user_provider:
            id: sylius.shop_user_provider.email_or_name_based
        sylius_api_shop_user_provider:
            id: sylius.shop_user_provider.email_or_name_based

    password_hashers:
        Sylius\Component\User\Model\UserInterface: argon2i
    firewalls:
        admin:
            switch_user: true
            context: admin
            pattern: "%sylius.security.admin_regex%"
            provider: sylius_admin_user_provider
            user_checker: security.user_checker.chain.admin
            form_login:
                provider: sylius_admin_user_provider
                login_path: sylius_admin_login
                check_path: sylius_admin_login_check
                failure_path: sylius_admin_login
                default_target_path: sylius_admin_dashboard
                use_forward: false
                use_referer: true
                enable_csrf: true
                csrf_parameter: _csrf_admin_security_token
                csrf_token_id: admin_authenticate
            two_factor:
                auth_form_path: three_brs_admin_two_factor_challenge
                check_path: three_brs_admin_two_factor_check
                default_target_path: sylius_admin_dashboard
                post_only: true
                enable_csrf: false
                prepare_on_login: true
                prepare_on_access_denied: true
                trusted_parameter_name: _trusted
            remember_me:
                secret: "%env(APP_SECRET)%"
                path: "/%sylius_admin.path_name%"
                name: APP_ADMIN_REMEMBER_ME
                lifetime: 31536000
                remember_me_parameter: _remember_me
            logout:
                path: sylius_admin_logout
                target: sylius_admin_login

        api_admin:
            pattern: "%sylius.security.api_admin_regex%/.*"
            provider: sylius_api_admin_user_provider
            user_checker: security.user_checker.chain.api_admin
            stateless: true
            entry_point: jwt
            json_login:
                check_path: "%sylius.security.api_admin_route%/administrators/token"
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            jwt: true

        api_shop:
            pattern: "%sylius.security.api_shop_regex%/.*"
            provider: sylius_api_shop_user_provider
            user_checker: security.user_checker.chain.api_shop
            stateless: true
            entry_point: jwt
            json_login:
                check_path: "%sylius.security.api_shop_route%/customers/token"
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            jwt: true

        shop:
            switch_user: { role: ROLE_ALLOWED_TO_SWITCH }
            context: shop
            pattern: "%sylius.security.shop_regex%"
            provider: sylius_shop_user_provider
            user_checker: security.user_checker.chain.shop
            form_login:
                success_handler: ThreeBRS\EnterpriseSecurityBundle\TwoFactor\TwoFactorAwareAuthenticationSuccessHandler.shop
                failure_handler: sylius.authentication.failure_handler
                provider: sylius_shop_user_provider
                login_path: sylius_shop_login
                check_path: sylius_shop_login_check
                failure_path: sylius_shop_login
                default_target_path: sylius_shop_homepage
                use_forward: false
                use_referer: true
                enable_csrf: true
                csrf_parameter: _csrf_shop_security_token
                csrf_token_id: shop_authenticate
            two_factor:
                auth_form_path: three_brs_shop_two_factor_challenge
                check_path: three_brs_shop_two_factor_check
                default_target_path: sylius_shop_homepage
                post_only: true
                enable_csrf: false
                prepare_on_login: true
                prepare_on_access_denied: true
                trusted_parameter_name: _trusted
            json_login:
                check_path: sylius_shop_json_login_check
                username_path: _username
                password_path: _password
                success_handler: sylius.authentication.success_handler
                failure_handler: sylius.authentication.failure_handler
            remember_me:
                secret: "%env(APP_SECRET)%"
                name: APP_SHOP_REMEMBER_ME
                lifetime: 31536000
                remember_me_parameter: _remember_me
            logout:
                path: sylius_shop_logout
                target: sylius_shop_homepage
                invalidate_session: false

        image_resolver:
            pattern: ^/media/cache/resolve
            security: false

        dev:
            pattern:  ^/(_(profiler|wdt)|css|images|js)/
            security: false

    access_control:
        - { path: ^/admin/2fa, role: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/2fa, role: IS_AUTHENTICATED_2FA_IN_PROGRESS }

        - { path: "%sylius.security.admin_regex%/forgotten-password", role: PUBLIC_ACCESS }

        - { path: "%sylius.security.admin_regex%/login", role: PUBLIC_ACCESS }
        - { path: "%sylius.security.shop_regex%/login", role: PUBLIC_ACCESS }

        - { path: "%sylius.security.admin_regex%/oauth/[a-z_]+/start", role: PUBLIC_ACCESS }
        - { path: "%sylius.security.admin_regex%/oauth/[a-z_]+/callback", role: PUBLIC_ACCESS }
        - { path: "%sylius.security.admin_regex%/oauth/confirm-link", role: PUBLIC_ACCESS }

        - { path: "%sylius.security.admin_regex%/magic-link$", role: PUBLIC_ACCESS }
        - { path: "%sylius.security.admin_regex%/magic-link/verify/", role: PUBLIC_ACCESS }
        - { path: ^/magic-link$, role: PUBLIC_ACCESS }
        - { path: ^/magic-link/verify/, role: PUBLIC_ACCESS }

        - { path: ^/passkey/login/options$, role: PUBLIC_ACCESS }
        - { path: ^/passkey/login/verify$, role: PUBLIC_ACCESS }
        - { path: "%sylius.security.admin_regex%/passkey/login/options$", role: PUBLIC_ACCESS }
        - { path: "%sylius.security.admin_regex%/passkey/login/verify$", role: PUBLIC_ACCESS }

        - { path: "%sylius.security.shop_regex%/register", role: PUBLIC_ACCESS }
        - { path: "%sylius.security.shop_regex%/verify", role: PUBLIC_ACCESS }

        - { path: "%sylius.security.admin_regex%", role: ROLE_ADMINISTRATION_ACCESS }
        - { path: "%sylius.security.shop_regex%/account", role: ROLE_USER }

        - { path: "%sylius.security.api_admin_route%/administrators/reset-password", role: PUBLIC_ACCESS }
        - { path: "%sylius.security.api_admin_regex%/.*", role: ROLE_API_ACCESS }
        - { path: "%sylius.security.api_admin_route%/administrators/token", role: PUBLIC_ACCESS }
        - { path: "%sylius.security.api_shop_account_regex%/.*", role: ROLE_USER }
        - { path: "%sylius.security.api_shop_route%/customers/token", role: PUBLIC_ACCESS }
        - { path: "%sylius.security.api_shop_regex%/.*", role: PUBLIC_ACCESS }
