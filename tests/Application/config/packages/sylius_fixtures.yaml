sylius_fixtures:
    suites:
        default:
            fixtures:
                channel:
                    options:
                        custom:
                            default:
                                name: "Default"
                                code: "DEFAULT"
                                hostname: "localhost:8080"
                                base_currency: "EUR"
                                default_locale: "en_US"
                                locales:
                                    - "en_US"
                                shipping_address_in_checkout_required: true

                locale:
                    options:
                        locales:
                            - en_US

                admin_user:
                    options:
                        custom:
                            sylius_api:
                                username: sylius_api
                                password: sylius
                                email: sylius_api@example.com
                                first_name: Sylius
                                last_name: API
                                api: true

                shop_user:
                    options:
                        custom:
                            customer_strong_password:
                                email: strong@example.com
                                password: "StrongPass1!"
                                first_name: Strong
                                enabled: true
                            customer_weak_password:
                                email: weak@example.com
                                password: "weakpass"
                                first_name: Weak
                                enabled: true
                            customer_no_uppercase:
                                email: nouppercase@example.com
                                password: "nouppercase1!"
                                first_name: NoUppercase
                                enabled: true
                            customer_no_numbers:
                                email: nonumbers@example.com
                                password: "NoNumbers!!"
                                first_name: NoNumbers
                                enabled: true
                            customer_with_history:
                                email: history@example.com
                                password: "CurrentPass1!"
                                first_name: History
                                enabled: true
                            customer_expired:
                                email: expired@example.com
                                password: "ExpiredPass1!"
                                first_name: Expired
                                enabled: true

                three_brs_password_history:
                    options:
                        shop_users:
                            - email: history@example.com
                              passwords:
                                  - "OldPass1!"
                                  - "OldPass2!"
                        admin_users:
                            - email: sylius@example.com
                              passwords:
                                  - "OldAdminPass1!"
                                  - "OldAdminPass2!"

                three_brs_password_expiration:
                    options:
                        shop_users:
                            - email: expired@example.com
                              password_changed_days_ago: 100
                        admin_users: []

                three_brs_two_factor:
                    options:
                        shop_users: []
                        admin_users: []

                three_brs_magic_link:
                    options:
                        shop_users: []
                        admin_users: []

                three_brs_passkey:
                    options:
                        shop_users: []
                        admin_users: []

                three_brs_social_account_link:
                    options:
                        shop_users:
                            - email: strong@example.com
                              links:
                                  - provider: google
                                    provider_user_id: google-demo-customer-1
                                    email: strong@example.com
                        admin_users:
                            - email: sylius@example.com
                              links:
                                  - provider: google
                                    provider_user_id: google-demo-admin-1
                                    email: sylius@example.com
