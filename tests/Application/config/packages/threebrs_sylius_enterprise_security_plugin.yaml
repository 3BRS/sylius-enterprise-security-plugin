imports:
    - { resource: "@ThreeBRSSyliusEnterpriseSecurityPlugin/Resources/config/config.{yml,yaml}" }

three_brs_sylius_enterprise_security:
    password_history:
        customer:
            enabled: true
            count: 5
        admin:
            enabled: true
            count: 10
    password_expiration:
        customer:
            enabled: true
            days: 90
        admin:
            enabled: true
            days: 60
    password_change_notification:
        customer:
            enabled: true
        admin:
            enabled: true
    two_factor_authentication:
        customer:
            mode: allowed
        admin:
            mode: allowed
        recovery_codes:
            customer:
                enabled: true
                count: 8
            admin:
                enabled: true
                count: 8
        trusted_device:
            enabled: true
            days: 60
    password_policy:
        customer:
            min_length: 8
            max_length: ~
            require_uppercase: true
            require_lowercase: true
            require_numbers: true
            require_special_characters: true
        admin:
            min_length: 12
            max_length: ~
            require_uppercase: true
            require_lowercase: true
            require_numbers: true
            require_special_characters: true
    oauth:
        customer:
            google:
                enabled: true
                client_id: '%env(GOOGLE_CUSTOMER_CLIENT_ID)%'
                client_secret: '%env(GOOGLE_CUSTOMER_CLIENT_SECRET)%'
        admin:
            auto_register_allowed_email_domains: [example.com]
            google:
                enabled: true
                client_id: '%env(GOOGLE_ADMIN_CLIENT_ID)%'
                client_secret: '%env(GOOGLE_ADMIN_CLIENT_SECRET)%'
    magic_link:
        customer:
            enabled: true
            expiration_seconds: 300
        admin:
            enabled: true
            expiration_seconds: 300
    passkey:
        rp_id: localhost
        rp_name: 'Sylius Test Shop'
        skip_2fa_when_user_verified: false
        customer:
            enabled: true
        admin:
            enabled: true
    account_lockout:
        customer:
            enabled: true
            max_attempts: 5
            auto_unlock_after: 900
        admin:
            enabled: true
            max_attempts: 3
            auto_unlock_after: 1800
    rate_limit:
        customer:
            login:
                enabled: true
                limit: 5
                interval: '15 minutes'
            password_reset:
                enabled: true
                limit: 3
                interval: '1 hour'
            register:
                enabled: true
                limit: 5
                interval: '1 hour'
            magic_link:
                enabled: true
                limit: 3
                interval: '15 minutes'
        admin:
            login:
                enabled: true
                limit: 5
                interval: '15 minutes'
            password_reset:
                enabled: true
                limit: 3
                interval: '1 hour'
            magic_link:
                enabled: true
                limit: 3
                interval: '15 minutes'
    session_management:
        customer:
            enabled: true
        admin:
            enabled: true
    login_notifications:
        customer:
            enabled: true
        admin:
            enabled: true
    account_deletion:
        customer:
            enabled: true
            grace_period_days: 30
