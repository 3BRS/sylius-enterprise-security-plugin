imports:
    - { resource: "@ThreeBRSSyliusEnterpriseSecurityPlugin/Resources/config/config.{yml,yaml}" }

three_brs_sylius_enterprise_security:
    password_history:
        customer:
            enabled: true
            count: 5
        admin:
            enabled: true
            count: 10
    password_expiration:
        customer:
            enabled: true
            days: 90
        admin:
            enabled: true
            days: 60
    password_change_notification:
        customer:
            enabled: true
        admin:
            enabled: true
    two_factor_authentication:
        customer:
            mode: optional
        admin:
            mode: optional
        recovery_codes:
            customer:
                enabled: true
                count: 8
            admin:
                enabled: true
                count: 8
        trusted_device:
            enabled: true
            days: 60
    password_policy:
        customer:
            min_length: 8
            max_length: ~
            require_uppercase: true
            require_lowercase: true
            require_numbers: true
            require_special_characters: true
        admin:
            min_length: 12
            max_length: ~
            require_uppercase: true
            require_lowercase: true
            require_numbers: true
            require_special_characters: true
    oauth:
        customer:
            google:
                enabled: true
                client_id: '%env(GOOGLE_CUSTOMER_CLIENT_ID)%'
                client_secret: '%env(GOOGLE_CUSTOMER_CLIENT_SECRET)%'
        admin:
            auto_register_allowed_email_domains: [example.com]
            google:
                enabled: true
                client_id: '%env(GOOGLE_ADMIN_CLIENT_ID)%'
                client_secret: '%env(GOOGLE_ADMIN_CLIENT_SECRET)%'
