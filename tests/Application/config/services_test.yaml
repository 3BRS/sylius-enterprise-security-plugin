imports:
    - { resource: "../../Behat/Resources/services.xml" }
    - { resource: "../../../vendor/sylius/sylius/src/Sylius/Behat/Resources/config/services.xml" }

# workaround needed for strange "test.client.history" problem
# see https://github.com/FriendsOfBehat/SymfonyExtension/issues/88
services:
    Symfony\Component\BrowserKit\AbstractBrowser: '@test.client'

    sylius.email_sender:
        class: Tests\ThreeBRS\SyliusEnterpriseSecurityPlugin\Mailer\SpySender
        public: true

    Tests\ThreeBRS\SyliusEnterpriseSecurityPlugin\OAuth\FakeOAuthState:
        public: true

    # Override the real Google OAuth provider with a fake one during tests.
    ThreeBRS\EnterpriseSecurityBundle\OAuth\GoogleOAuthProvider:
        class: Tests\ThreeBRS\SyliusEnterpriseSecurityPlugin\OAuth\FakeOAuthProvider
        arguments:
            $name: 'google'
            $state: '@Tests\ThreeBRS\SyliusEnterpriseSecurityPlugin\OAuth\FakeOAuthState'
            $settings: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Settings\SettingsProvider'
        tags:
            - { name: 'three_brs.oauth_provider' }

    # Override the real Apple OAuth provider with a fake one during tests.
    ThreeBRS\EnterpriseSecurityBundle\OAuth\AppleOAuthProvider:
        class: Tests\ThreeBRS\SyliusEnterpriseSecurityPlugin\OAuth\FakeOAuthProvider
        arguments:
            $name: 'apple'
            $state: '@Tests\ThreeBRS\SyliusEnterpriseSecurityPlugin\OAuth\FakeOAuthState'
            $settings: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Settings\SettingsProvider'
        tags:
            - { name: 'three_brs.oauth_provider' }

    # Override the real Microsoft OAuth provider with a fake one during tests.
    ThreeBRS\EnterpriseSecurityBundle\OAuth\MicrosoftOAuthProvider:
        class: Tests\ThreeBRS\SyliusEnterpriseSecurityPlugin\OAuth\FakeOAuthProvider
        arguments:
            $name: 'microsoft'
            $state: '@Tests\ThreeBRS\SyliusEnterpriseSecurityPlugin\OAuth\FakeOAuthState'
            $settings: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Settings\SettingsProvider'
        tags:
            - { name: 'three_brs.oauth_provider' }
