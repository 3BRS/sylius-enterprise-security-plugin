services:
    mailer:
        image: axllent/mailpit
        ports:
            - "${MAILPIT_SMTP_PORT:-1025}:1025"
            - "${MAILPIT_UI_PORT:-8025}:8025"
        environment:
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1
        networks:
            - sylius

    php:
        environment:
            MAILER_DSN: "smtp://mailer:1025"
        depends_on:
            - mailer
