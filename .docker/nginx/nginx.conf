server {
    listen 80;

    server_name sylius_plugin_docker;

    root /srv/sylius/tests/Application/public;
    index index.php;

    location / {
        # try to serve file directly, fallback to index.php
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass ${FASTCGI_PASS};
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    # return 404 for all other php files not matching the front controller
    # this prevents access to other php files you don't want to be accessible.
    location ~ \.php$ {
        return 404;
    }
}

# Behat @javascript scenarios. This vhost boots the test front controller, which
# pins APP_ENV=test and puts the browser on the same database as the suite.
# Chrome resolves localhost to this container, so the browser origin is
# http://localhost:8081 - a secure context, which WebAuthn refuses to run without,
# and a host that matches rp_id. Plain http://nginx would have failed both.
# It listens on its own port rather than on 80 as a second server_name, because
# matching Host "localhost" there would shadow the dev site on the published port.
# The port is unprivileged so that CI, which has no nginx, can serve the same
# origin from `php -S` and share one Behat configuration with this setup.
server {
    listen 8081;

    server_name localhost;

    root /srv/sylius/tests/Application/public;
    index index_test.php;

    location / {
        try_files $uri /index_test.php$is_args$args;
    }

    location ~ ^/index_test\.php(/|$) {
        fastcgi_pass ${FASTCGI_PASS};
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~ \.php$ {
        return 404;
    }
}
