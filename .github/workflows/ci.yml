name: CI

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    build:
        name: "PHP ${{ matrix.php }} | Sylius ${{ matrix.sylius }} | Symfony ${{ matrix.symfony }} | ${{ matrix.prefer }} | API Platform ${{ matrix.api_platform }}"
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: [ "8.3" ]
                sylius: [ "2.1", "2.2" ]
                symfony: [ "7.4" ]
                prefer: [ "lowest", "dist" ]
                # "default" lets Composer resolve api-platform freely (dist -> latest,
                # lowest -> the lowest allowed). "4.3.5" pins the whole api-platform
                # suite to the version that triggers the nested-IRI / property-info
                # regression, so CI proves the workaround holds on the lowest 4.3.x too.
                api_platform: [ "default", "4.3.5" ]
                exclude:
                    # Pinning api-platform to an exact version is at odds with
                    # --prefer-lowest (which would otherwise pull the lowest allowed),
                    # so only exercise the pinned version with the dist resolution.
                    -   prefer: "lowest"
                        api_platform: "4.3.5"
                include:
                    # composer.json allows php ^8.3 and symfony ^6.4|^7.4|^8.0, and a
                    # constraint nothing installs is a claim nobody has checked. Both
                    # ends are covered by one leg each rather than by widening the
                    # matrix, which would turn six runs into twenty-four.
                    -   php: "8.4"
                        sylius: "2.2"
                        symfony: "7.4"
                        prefer: "dist"
                        api_platform: "default"
                    -   php: "8.3"
                        sylius: "2.2"
                        symfony: "6.4"
                        prefer: "dist"
                        api_platform: "default"
                    # The corners of the supported space. Each end was reachable
                    # above, but only with everything else in the middle, so a fault
                    # that needs two extremes at once had nowhere to show.
                    #
                    # Oldest of everything, and the resolution that actually installs
                    # the floor of every constraint:
                    -   php: "8.3"
                        sylius: "2.1"
                        symfony: "6.4"
                        prefer: "lowest"
                        api_platform: "default"
                    # Newest PHP against the oldest Symfony:
                    -   php: "8.4"
                        sylius: "2.2"
                        symfony: "6.4"
                        prefer: "dist"
                        api_platform: "default"
                    # Newest PHP against the oldest Sylius:
                    -   php: "8.4"
                        sylius: "2.1"
                        symfony: "7.4"
                        prefer: "dist"
                        api_platform: "default"
                    # Sylius 2.3 on Symfony 6.4, 7.4 and 8; Symfony 8 requires PHP 8.4:
                    -   php: "8.3"
                        sylius: "2.3"
                        symfony: "6.4"
                        prefer: "lowest"
                        api_platform: "default"
                    -   php: "8.3"
                        sylius: "2.3"
                        symfony: "7.4"
                        prefer: "lowest"
                        api_platform: "default"
                    -   php: "8.3"
                        sylius: "2.3"
                        symfony: "7.4"
                        prefer: "dist"
                        api_platform: "default"
                    -   php: "8.4"
                        sylius: "2.3"
                        symfony: "8.1"
                        prefer: "lowest"
                        api_platform: "default"
                    -   php: "8.4"
                        sylius: "2.3"
                        symfony: "8.1"
                        prefer: "dist"
                        api_platform: "default"

        env:
            SYMFONY_REQUIRE: "${{ matrix.symfony }}.*"

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: pass_root
                    MYSQL_USER: sylius
                    MYSQL_PASSWORD: pass
                ports:
                    - 3306:3306
                options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    extensions: intl, mbstring, pdo_mysql
                    tools: composer:v2

            -   name: Setup Node
                uses: actions/setup-node@v4
                with:
                    node-version: '22'

            -   name: Install Yarn
                run: npm install -g yarn

            -   name: Require Sylius version
                run: composer require "sylius/sylius:${{ matrix.sylius }}.*" --no-interaction --no-update --no-scripts

            -   name: Require Symfony version
                # Global Flex applies SYMFONY_REQUIRE to all symfony/* packages, including
                # the transitive ones.
                run: |
                    composer global config --no-plugins allow-plugins.symfony/flex true
                    composer global require --no-progress --no-scripts --no-plugins symfony/flex

            # Sylius 2.1 and 2.2 Behat contexts need Behat 3, their admin and shop assets Encore 5
            -   name: Require Behat 3 and Encore 5
                if: contains(fromJSON('["2.1", "2.2"]'), matrix.sylius)
                run: |
                    composer require --dev "behat/behat:^3.34" --no-interaction --no-update --no-scripts
                    (cd tests/Application && npm pkg set "devDependencies.@symfony/webpack-encore=^5.0.1")

            # sylius/fixtures-bundle 1.10 (Sylius 2.3) uses Monolog\Level, which only Monolog 3 has
            -   name: Require Monolog 3
                if: matrix.sylius == '2.3'
                run: composer require --dev "monolog/monolog:^3.0" --no-interaction --no-update --no-scripts

            -   name: Pin API Platform version
                if: matrix.api_platform != 'default'
                run: |
                    composer require --no-interaction --no-update --no-scripts \
                      "api-platform/symfony:${{ matrix.api_platform }}" \
                      "api-platform/metadata:${{ matrix.api_platform }}" \
                      "api-platform/serializer:${{ matrix.api_platform }}" \
                      "api-platform/state:${{ matrix.api_platform }}" \
                      "api-platform/doctrine-orm:${{ matrix.api_platform }}" \
                      "api-platform/doctrine-common:${{ matrix.api_platform }}" \
                      "api-platform/json-schema:${{ matrix.api_platform }}" \
                      "api-platform/jsonld:${{ matrix.api_platform }}" \
                      "api-platform/hydra:${{ matrix.api_platform }}" \
                      "api-platform/openapi:${{ matrix.api_platform }}" \
                      "api-platform/http-cache:${{ matrix.api_platform }}" \
                      "api-platform/documentation:${{ matrix.api_platform }}" \
                      "api-platform/validator:${{ matrix.api_platform }}"

            -   name: Install dependencies (prefer ${{ matrix.prefer }})
                run: composer update --prefer-${{ matrix.prefer }} --no-interaction --no-scripts

            -   name: Run post-install scripts
                run: composer run-script post-install-cmd --no-interaction

            -   name: Install Yarn dependencies
                run: yarn --cwd=tests/Application install --pure-lockfile

            -   name: Build assets
                run: GULP_ENV=prod yarn --cwd=tests/Application build

            -   name: Wait for MySQL
                run: |
                    until mysqladmin ping -h 127.0.0.1 -P 3306 -u root -ppass_root --silent; do
                        echo "Waiting for MySQL..."
                        sleep 2
                    done

            -   name: Setup database
                env:
                    DATABASE_URL: "mysql://root:pass_root@127.0.0.1:3306/sylius_test?serverVersion=8.0&charset=utf8mb4"
                run: |
                    php bin/console doctrine:database:create --env=test --no-interaction --if-not-exists
                    php bin/console doctrine:migrations:migrate --env=test --no-interaction
                    php bin/console doctrine:schema:update --env=test --no-interaction --complete --force

            -   name: PHPStan
                env:
                    DATABASE_URL: "mysql://root:pass_root@127.0.0.1:3306/sylius_test?serverVersion=8.0&charset=utf8mb4"
                run: |
                    touch .env
                    vendor/bin/phpstan analyse

            -   name: ECS
                run: vendor/bin/ecs check

            -   name: Symfony lint
                run: php bin/console lint:container --env=test

            -   name: Suite lint
                env:
                    DATABASE_URL: "mysql://root:pass_root@127.0.0.1:3306/sylius_test?serverVersion=8.0&charset=utf8mb4"
                # A suite nobody imported is not an error to Behat, so a green Behat
                # step says nothing about the scenarios it never loaded. Seconds, on a
                # dry run.
                run: php bin/suite_lint.php

            -   name: PHPUnit
                env:
                    DATABASE_URL: "mysql://root:pass_root@127.0.0.1:3306/sylius_test?serverVersion=8.0&charset=utf8mb4"
                run: vendor/bin/phpunit

            -   name: Behat
                env:
                    DATABASE_URL: "mysql://root:pass_root@127.0.0.1:3306/sylius_test?serverVersion=8.0&charset=utf8mb4"
                run: vendor/bin/behat --no-interaction --format=progress

    browser:
        # The matrix above runs the Behat suite on BrowserKit, which cannot execute
        # JavaScript, so the passkey ceremony the plugin ships is exercised nowhere in
        # it. This job runs the one suite that needs a real browser.
        #
        # Two legs rather than one. The shipped JavaScript does not vary with the
        # dependencies, but what it talks to does: a real browser sends attestation and
        # assertion data of its own making, while the suites in the matrix above feed
        # the server a fixture built to match the version in vendor. On one leg the
        # oldest web-auth/webauthn-lib the plugin allows would never meet a browser at
        # all — which is the version a consumer pinning to a floor actually runs.
        #
        # Splitting further would buy nothing: Sylius and PHP do not reach the
        # ceremony, and --prefer-lowest already installs the floor of every constraint
        # at once.
        name: "Behat (browser, ${{ matrix.prefer }})"
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                prefer: [ "dist", "lowest" ]

        env:
            DATABASE_URL: "mysql://root:pass_root@127.0.0.1:3306/sylius_test?serverVersion=8.0&charset=utf8mb4"

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: pass_root
                ports:
                    - 3306:3306
                options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "8.3"
                    extensions: intl, mbstring, pdo_mysql
                    tools: composer:v2

            -   name: Setup Node
                uses: actions/setup-node@v4
                with:
                    node-version: '22'

            -   name: Install Yarn
                run: npm install -g yarn

            # Sylius 2.3 in both legs; the matrix above runs 2.1 and 2.2 as well.
            -   name: Require Sylius version
                run: composer require "sylius/sylius:2.3.*" --no-interaction --no-update --no-scripts

            # sylius/fixtures-bundle 1.10 (Sylius 2.3) uses Monolog\Level, which only Monolog 3 has
            -   name: Require Monolog 3
                run: composer require --dev "monolog/monolog:^3.0" --no-interaction --no-update --no-scripts

            -   name: Install dependencies (prefer ${{ matrix.prefer }})
                run: composer update --prefer-${{ matrix.prefer }} --no-interaction --no-scripts

            -   name: Run post-install scripts
                run: composer run-script post-install-cmd --no-interaction

            -   name: Install Yarn dependencies
                run: yarn --cwd=tests/Application install --pure-lockfile

            -   name: Build assets
                run: GULP_ENV=prod yarn --cwd=tests/Application build

            -   name: Install bundle assets
                # passkey.js is served to the browser as a static file out of
                # public/bundles, which is generated and gitignored. Skipping this
                # leaves a 404 in place of the script the scenario exists to run.
                #
                # The target is named because the default is `public` relative to the
                # working directory, not to kernel.project_dir. From the repository
                # root that is the plugin's own asset source, so the command copies it
                # into itself until the paths are too long to open.
                run: php bin/console assets:install tests/Application/public --env=test

            -   name: Wait for MySQL
                run: |
                    until mysqladmin ping -h 127.0.0.1 -P 3306 -u root -ppass_root --silent; do
                        echo "Waiting for MySQL..."
                        sleep 2
                    done

            -   name: Setup database
                run: |
                    php bin/console doctrine:database:create --env=test --no-interaction --if-not-exists
                    php bin/console doctrine:migrations:migrate --env=test --no-interaction
                    php bin/console doctrine:schema:update --env=test --no-interaction --complete --force

            -   name: Start Chrome
                # behat.dist.php reaches the browser at http://chrome:9222, which is the
                # container name under docker compose. Aliasing it here is what lets one
                # configuration serve both, instead of a CI-only profile that would then
                # drift from the one developers actually run.
                run: |
                    echo "127.0.0.1 chrome" | sudo tee -a /etc/hosts
                    google-chrome --version
                    google-chrome \
                      --headless=new \
                      --no-sandbox \
                      --disable-gpu \
                      --disable-dev-shm-usage \
                      --remote-debugging-address=127.0.0.1 \
                      --remote-debugging-port=9222 \
                      --remote-allow-origins='*' \
                      about:blank > "${{ runner.temp }}/chrome.log" 2>&1 &
                    for _ in $(seq 1 30); do
                        curl -sf -o /dev/null http://localhost:9222/json/version && exit 0
                        sleep 1
                    done
                    echo "Chrome did not open a debugging port:"
                    cat "${{ runner.temp }}/chrome.log"
                    exit 1

            -   name: Start the test web server
                # WebAuthn refuses to run outside a secure context and wants rp_id to
                # equal the origin host, so the browser has to reach the application as
                # localhost - 127.0.0.1 is trustworthy but is not a usable rp_id. There
                # is no nginx here: index_test.php doubles as the router for `php -S`
                # and pins APP_ENV=test, so the browser shares the suite's database.
                run: |
                    # `php -S` builds $_SERVER for each request out of the request, and
                    # $_ENV is not populated from the environment here either, so Dotenv
                    # finds no DATABASE_URL and falls back to .env.test - which names the
                    # docker compose host and resolves to nothing on a runner. This file
                    # is loaded last and is the one channel that reaches the server.
                    printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > tests/Application/.env.test.local
                    PHP_CLI_SERVER_WORKERS=4 php -S 0.0.0.0:8081 \
                      -t tests/Application/public \
                      tests/Application/public/index_test.php \
                      > "${{ runner.temp }}/web-server.log" 2>&1 &
                    # Asking for a static asset rather than a page: no scenario has run
                    # yet, so the database holds no channel and every route answers 500.
                    # It doubles as proof that assets:install put the script in place.
                    for _ in $(seq 1 30); do
                        curl -sf -o /dev/null \
                          http://localhost:8081/bundles/threebrssyliusenterprisesecurityplugin/js/passkey.js \
                          && exit 0
                        sleep 1
                    done
                    echo "Web server did not serve the passkey script:"
                    cat "${{ runner.temp }}/web-server.log"
                    exit 1

            -   name: Behat
                run: vendor/bin/behat -p javascript --suite=shop_passkey_browser --no-interaction --format=progress

            -   name: Web server log
                if: failure()
                run: cat "${{ runner.temp }}/web-server.log"
