sylius_twig_hooks:
    hooks:
        # Swap the dashboard "Change password" button for "Set a new password"
        # when the signed-in customer has no password yet (OAuth / magic link /
        # passkey). The template renders the original button for everyone else.
        'sylius_shop.account.dashboard.index.content.main.section.buttons':
            change_password:
                template: '@ThreeBRSSyliusEnterpriseSecurityPlugin/Shop/SetPassword/dashboard_button.html.twig'
                priority: 100
