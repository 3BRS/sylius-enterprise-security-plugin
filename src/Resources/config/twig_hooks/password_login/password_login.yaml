sylius_twig_hooks:
    hooks:
        # Hide the email + password credential form when password login is disabled for the
        # scope, leaving the plugin's OAuth / magic-link / passkey buttons (separate sibling
        # hookables) untouched. We override the Sylius `form` hookable's template (keeping the
        # hookable identity, so its nested `{% hook 'form' %}` fields still resolve) and gate
        # the body on three_brs_password_login_enabled(scope).
        'sylius_shop.account.login.content.login_container':
            form:
                template: '@ThreeBRSSyliusEnterpriseSecurityPlugin/Shop/PasswordLogin/login_form.html.twig'
                priority: 100
            # The "forgot your password?" link is a sibling of the form here — hide it too
            # when password login is off (on admin it lives inside the form, so it is already
            # hidden when the form is). Reset is meaningless without password login.
            forgot_password:
                template: '@ThreeBRSSyliusEnterpriseSecurityPlugin/Shop/PasswordLogin/forgot_password.html.twig'
                priority: 0

        'sylius_admin.security.login.page.content':
            form:
                template: '@ThreeBRSSyliusEnterpriseSecurityPlugin/Admin/PasswordLogin/login_form.html.twig'
                priority: 0

        # The checkout address step offers an inline sign-in (email + password, submitted to
        # sylius_shop_json_login_check) as soon as the typed email belongs to an existing account.
        # With password login off that password box must go — the shop firewall refuses the
        # credentials anyway, and a passwordless customer has no password to type in the first place.
        'sylius_shop.checkout.address.content.form':
            user:
                template: '@ThreeBRSSyliusEnterpriseSecurityPlugin/Shop/PasswordLogin/checkout_user.html.twig'
                priority: 200

        # Registration is a Live Component — keep the component, only swap its rendered template.
        'sylius_shop.account.register.content':
            form:
                component: 'sylius_shop:account:register:form'
                props:
                    resource: '@=_context.customer'
                    form: '@=_context.form'
                    template: '@ThreeBRSSyliusEnterpriseSecurityPlugin/Shop/PasswordLogin/register_form.html.twig'
                priority: 0
