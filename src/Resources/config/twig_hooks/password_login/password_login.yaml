sylius_twig_hooks:
    hooks:
        # Hide the email + password credential form when password login is disabled for the
        # scope, leaving the plugin's OAuth / magic-link / passkey buttons (separate sibling
        # hookables) untouched. We override the Sylius `form` hookable's template (keeping the
        # hookable identity, so its nested `{% hook 'form' %}` fields still resolve) and gate
        # the body on three_brs_password_login_enabled(scope).
        'sylius_shop.account.login.content.login_container':
            form:
                template: '@ThreeBRSSyliusEnterpriseSecurityPlugin/Shop/PasswordLogin/login_form.html.twig'
                priority: 100

        'sylius_admin.security.login.page.content':
            form:
                template: '@ThreeBRSSyliusEnterpriseSecurityPlugin/Admin/PasswordLogin/login_form.html.twig'
                priority: 0

        # Registration is a Live Component — keep the component, only swap its rendered template.
        'sylius_shop.account.register.content':
            form:
                component: 'sylius_shop:account:register:form'
                props:
                    resource: '@=_context.customer'
                    form: '@=_context.form'
                    template: '@ThreeBRSSyliusEnterpriseSecurityPlugin/Shop/PasswordLogin/register_form.html.twig'
                priority: 0
