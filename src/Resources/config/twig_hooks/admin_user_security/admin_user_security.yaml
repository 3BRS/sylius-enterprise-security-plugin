sylius_twig_hooks:
    hooks:
        # Renders a "Security" dropdown button in the admin user update (edit)
        # page header actions, to the right of the Update button (priority
        # below Update's 0 makes it render last). Replaces the former
        # Security card that lived in the right column.
        'sylius_admin.admin_user.update.content.header.title_block.actions':
            three_brs_admin_security:
                template: '@ThreeBRSSyliusEnterpriseSecurityPlugin/Admin/AdminUser/Security/dropdown.html.twig'
                priority: -50
