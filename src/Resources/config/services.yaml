            $adminLinkRepository: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\AdminUserSocialAccountLinkRepository'
        tags:
            - { name: 'twig.extension' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Fixture\SocialAccountLinkFixture:
        arguments:
            $customerRepository: '@sylius.repository.customer'
            $adminUserRepository: '@sylius.repository.admin_user'
            $entityManager: '@doctrine.orm.entity_manager'
        tags:
            - { name: 'sylius_fixtures.fixture' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\CustomerMagicLinkTokenRepository:
        arguments:
            $registry: '@doctrine'
        tags:
            - { name: 'doctrine.repository_service' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\AdminUserMagicLinkTokenRepository:
        arguments:
            $registry: '@doctrine'
        tags:
            - { name: 'doctrine.repository_service' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\CustomerPasskeyCredentialRepository:
        arguments:
            $registry: '@doctrine'
        tags:
            - { name: 'doctrine.repository_service' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\AdminUserPasskeyCredentialRepository:
        arguments:
            $registry: '@doctrine'
        tags:
            - { name: 'doctrine.repository_service' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\Passkey\PasskeyRelyingPartyEntityFactory:
        arguments:
            $rpId: '%three_brs.passkey.rp_id%'
            $rpName: '%three_brs.passkey.rp_name%'

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\Passkey\PasskeyCeremonyStepManagerFactory:
        arguments:
            $rpId: '%three_brs.passkey.rp_id%'

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\Passkey\PasskeyValidatorFactory:
        arguments:
            $ceremonyStepManagerFactory: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\Passkey\PasskeyCeremonyStepManagerFactory'

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\Passkey\PasskeyWebauthnSerializer: ~

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\Passkey\SessionPasskeyOptionsStorage:
        arguments:
            $requestStack: '@request_stack'

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\Passkey\CustomerPasskeyRegistrationOptionsBuilder:
        arguments:
            $relyingPartyEntityFactory: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\Passkey\PasskeyRelyingPartyEntityFactory'
