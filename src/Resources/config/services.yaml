            $router: '@router'
            $tokenStorage: '@security.token_storage'
            $security: '@security.helper'
            $logger: '@logger'
        tags:
            - { name: 'controller.service_arguments' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Controller\Admin\OAuthConfirmLinkController:
        arguments:
            $handler: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\AdminSocialLoginHandler'
            $passwordHasher: '@security.user_password_hasher'
            $tokenStorage: '@security.token_storage'
            $router: '@router'
            $twig: '@twig'
            $linkRepository: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\AdminUserSocialAccountLinkRepository'
            $logger: '@logger'
        tags:
            - { name: 'controller.service_arguments' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Controller\Admin\SocialAccountUnlinkController:
        arguments:
            $security: '@security.helper'
            $linkRepository: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\AdminUserSocialAccountLinkRepository'
            $guard: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\LastAuthMethodGuard'
            $entityManager: '@doctrine.orm.entity_manager'
            $csrfTokenManager: '@security.csrf.token_manager'
            $router: '@router'
            $logger: '@logger'
