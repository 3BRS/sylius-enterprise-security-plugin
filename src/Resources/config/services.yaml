services:
    _defaults:
        autowire: false
        autoconfigure: false
        public: false

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Mailer\PasswordChangeEmailManager:
        arguments:
            $emailSender: '@sylius.email_sender'
            $router: '@router'

    ThreeBRS\SyliusEnterpriseSecurityPlugin\EventListener\PasswordChangeNotificationListener:
        arguments:
            $emailManager: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Mailer\PasswordChangeEmailManager'
            $requestStack: '@request_stack'
            $tokenStorage: '@security.token_storage'
            $logger: '@logger'
        tags:
            - { name: 'doctrine.event_listener', event: 'onFlush' }
            - { name: 'doctrine.event_listener', event: 'postFlush' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Validator\PasswordPolicyFilteringValidator:
        arguments:
            $inner: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Validator\PasswordPolicyFilteringValidator.inner'
        decorates: validator

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\CustomerPasswordHistoryRepository:
        factory: ['@doctrine.orm.entity_manager', 'getRepository']
        arguments:
            $className: ThreeBRS\SyliusEnterpriseSecurityPlugin\Entity\CustomerPasswordHistory

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\AdminUserPasswordHistoryRepository:
        factory: ['@doctrine.orm.entity_manager', 'getRepository']
        arguments:
            $className: ThreeBRS\SyliusEnterpriseSecurityPlugin\Entity\AdminUserPasswordHistory

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\PasswordHistoryChecker:
        arguments:
            $customerRepository: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\CustomerPasswordHistoryRepository'
            $adminRepository: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\AdminUserPasswordHistoryRepository'

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Validator\PasswordHistoryValidator:
        arguments:
            $checker: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\PasswordHistoryChecker'
            $tokenStorage: '@security.token_storage'
        tags:
            - { name: 'validator.constraint_validator', alias: 'three_brs.validator.password_history' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\EventListener\ShopUserPasswordHistoryListener:
        arguments:
            $repository: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\CustomerPasswordHistoryRepository'
            $logger: '@logger'
        tags:
            - { name: 'doctrine.event_listener', event: 'onFlush' }
            - { name: 'doctrine.event_listener', event: 'postFlush' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\EventListener\AdminUserPasswordHistoryListener:
        arguments:
            $repository: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\AdminUserPasswordHistoryRepository'
            $logger: '@logger'
        tags:
            - { name: 'doctrine.event_listener', event: 'onFlush' }
            - { name: 'doctrine.event_listener', event: 'postFlush' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\PasswordExpirationChecker: ~

    ThreeBRS\SyliusEnterpriseSecurityPlugin\EventListener\PasswordExpirationListener:
        arguments:
            $tokenStorage: '@security.token_storage'
            $checker: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\PasswordExpirationChecker'
            $router: '@router'
        tags:
            - { name: 'kernel.event_listener', event: 'kernel.request', method: 'onKernelRequest', priority: 4 }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Controller\Admin\ForcePasswordChangeController:
        arguments:
            $tokenStorage: '@security.token_storage'
            $passwordHasher: '@security.password_hasher'
            $entityManager: '@doctrine.orm.entity_manager'
            $router: '@router'
            $twig: '@twig'
            $formFactory: '@form.factory'
        tags:
            - { name: 'controller.service_arguments' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Form\Extension\AdminUserTypeExtension:
        tags:
            - { name: 'form.type_extension' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Fixture\PasswordHistoryFixture:
        arguments:
            $customerRepository: '@sylius.repository.customer'
            $adminUserRepository: '@sylius.repository.admin_user'
            $entityManager: '@doctrine.orm.entity_manager'
        tags:
            - { name: 'sylius_fixtures.fixture' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Fixture\PasswordExpirationFixture:
        arguments:
            $customerRepository: '@sylius.repository.customer'
            $adminUserRepository: '@sylius.repository.admin_user'
            $entityManager: '@doctrine.orm.entity_manager'
        tags:
            - { name: 'sylius_fixtures.fixture' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Fixture\TwoFactorFixture:
        arguments:
            $customerRepository: '@sylius.repository.customer'
            $adminUserRepository: '@sylius.repository.admin_user'
            $entityManager: '@doctrine.orm.entity_manager'
            $totpGenerator: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\TotpSecretGenerator'
            $recoveryGenerator: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\RecoveryCodeGenerator'
        tags:
            - { name: 'sylius_fixtures.fixture' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\CustomerRecoveryCodeRepository:
        factory: ['@doctrine.orm.entity_manager', 'getRepository']
        arguments:
            $className: ThreeBRS\SyliusEnterpriseSecurityPlugin\Entity\CustomerRecoveryCode

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\AdminUserRecoveryCodeRepository:
        factory: ['@doctrine.orm.entity_manager', 'getRepository']
        arguments:
            $className: ThreeBRS\SyliusEnterpriseSecurityPlugin\Entity\AdminUserRecoveryCode

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\TotpSecretGenerator: ~

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\QrCodeGenerator: ~

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\RecoveryCodeGenerator: ~

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\RecoveryCodeVerifier:
        arguments:
            $customerRepository: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\CustomerRecoveryCodeRepository'
            $adminRepository: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\AdminUserRecoveryCodeRepository'
            $generator: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\RecoveryCodeGenerator'
            $entityManager: '@doctrine.orm.entity_manager'
            $clock: '@clock'

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\TwoFactorEnforcementChecker:
        arguments:
            $customerMode: !php/enum ThreeBRS\SyliusEnterpriseSecurityPlugin\Model\TwoFactorMode::DISABLED
            $adminMode: !php/enum ThreeBRS\SyliusEnterpriseSecurityPlugin\Model\TwoFactorMode::DISABLED

    ThreeBRS\SyliusEnterpriseSecurityPlugin\EventListener\TwoFactorEnforcementListener:
        arguments:
            $tokenStorage: '@security.token_storage'
            $checker: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\TwoFactorEnforcementChecker'
            $router: '@router'
        tags:
            - { name: 'kernel.event_listener', event: 'kernel.request', method: 'onKernelRequest', priority: 3 }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Form\Type\TwoFactorVerifyType:
        tags:
            - { name: 'form.type' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Controller\Shop\TwoFactorSetupController:
        arguments:
            $tokenStorage: '@security.token_storage'
            $totpGenerator: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\TotpSecretGenerator'
            $qrGenerator: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\QrCodeGenerator'
            $recoveryGenerator: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\RecoveryCodeGenerator'
            $csrfTokenManager: '@security.csrf.token_manager'
            $entityManager: '@doctrine.orm.entity_manager'
            $formFactory: '@form.factory'
            $router: '@router'
            $twig: '@twig'
            $translator: '@translator'
            $issuer: '%three_brs.two_factor.issuer%'
            $recoveryCodesEnabled: '%three_brs.two_factor.customer.recovery_codes_enabled%'
            $recoveryCodesCount: '%three_brs.two_factor.customer.recovery_codes_count%'
        tags:
            - { name: 'controller.service_arguments' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Controller\Shop\TwoFactorRecoveryCodesController:
        arguments:
            $tokenStorage: '@security.token_storage'
            $router: '@router'
            $twig: '@twig'
        tags:
            - { name: 'controller.service_arguments' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Controller\Shop\TwoFactorDisableController:
        arguments:
            $tokenStorage: '@security.token_storage'
            $entityManager: '@doctrine.orm.entity_manager'
            $recoveryCodeRepository: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\CustomerRecoveryCodeRepository'
            $csrfTokenManager: '@security.csrf.token_manager'
            $router: '@router'
        tags:
            - { name: 'controller.service_arguments' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Controller\Shop\TwoFactorRegenerateRecoveryCodesController:
        arguments:
            $tokenStorage: '@security.token_storage'
            $entityManager: '@doctrine.orm.entity_manager'
            $recoveryCodeRepository: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\CustomerRecoveryCodeRepository'
            $recoveryGenerator: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\RecoveryCodeGenerator'
            $csrfTokenManager: '@security.csrf.token_manager'
            $router: '@router'
            $recoveryCodesEnabled: '%three_brs.two_factor.customer.recovery_codes_enabled%'
            $recoveryCodesCount: '%three_brs.two_factor.customer.recovery_codes_count%'
        tags:
            - { name: 'controller.service_arguments' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Controller\Admin\TwoFactorSetupController:
        arguments:
            $tokenStorage: '@security.token_storage'
            $totpGenerator: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\TotpSecretGenerator'
            $qrGenerator: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\QrCodeGenerator'
            $recoveryGenerator: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\RecoveryCodeGenerator'
            $csrfTokenManager: '@security.csrf.token_manager'
            $entityManager: '@doctrine.orm.entity_manager'
            $formFactory: '@form.factory'
            $router: '@router'
            $twig: '@twig'
            $translator: '@translator'
            $issuer: '%three_brs.two_factor.issuer%'
            $recoveryCodesEnabled: '%three_brs.two_factor.admin.recovery_codes_enabled%'
            $recoveryCodesCount: '%three_brs.two_factor.admin.recovery_codes_count%'
        tags:
            - { name: 'controller.service_arguments' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Controller\Admin\TwoFactorRecoveryCodesController:
        arguments:
            $tokenStorage: '@security.token_storage'
            $router: '@router'
            $twig: '@twig'
        tags:
            - { name: 'controller.service_arguments' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Security\TwoFactorAwareAuthenticationSuccessHandler.shop:
        class: ThreeBRS\SyliusEnterpriseSecurityPlugin\Security\TwoFactorAwareAuthenticationSuccessHandler
        arguments:
            $twoFactorAuthenticationRequiredHandler: '@security.authentication.authentication_required_handler.two_factor.shop'
            $defaultSuccessHandler: '@sylius.authentication.success_handler'
        public: true

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Controller\Admin\TwoFactorDisableController:
        arguments:
            $tokenStorage: '@security.token_storage'
            $entityManager: '@doctrine.orm.entity_manager'
            $recoveryCodeRepository: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\AdminUserRecoveryCodeRepository'
            $csrfTokenManager: '@security.csrf.token_manager'
            $router: '@router'
        tags:
            - { name: 'controller.service_arguments' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Controller\Admin\TwoFactorRegenerateRecoveryCodesController:
        arguments:
            $tokenStorage: '@security.token_storage'
            $entityManager: '@doctrine.orm.entity_manager'
            $recoveryCodeRepository: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\AdminUserRecoveryCodeRepository'
            $recoveryGenerator: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\RecoveryCodeGenerator'
            $csrfTokenManager: '@security.csrf.token_manager'
            $router: '@router'
            $recoveryCodesEnabled: '%three_brs.two_factor.admin.recovery_codes_enabled%'
            $recoveryCodesCount: '%three_brs.two_factor.admin.recovery_codes_count%'
        tags:
            - { name: 'controller.service_arguments' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Controller\Shop\TwoFactorRecoveryChallengeController:
        arguments:
            $tokenStorage: '@security.token_storage'
            $recoveryCodeVerifier: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\RecoveryCodeVerifier'
            $router: '@router'
            $twig: '@twig'
        tags:
            - { name: 'controller.service_arguments' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Controller\Admin\TwoFactorRecoveryChallengeController:
        arguments:
            $tokenStorage: '@security.token_storage'
            $recoveryCodeVerifier: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\RecoveryCodeVerifier'
            $router: '@router'
            $twig: '@twig'
        tags:
            - { name: 'controller.service_arguments' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Menu\ShopAccountMenuListener:
        tags:
            - { name: 'kernel.event_listener', event: 'sylius.menu.shop.account', method: 'addTwoFactorItem' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Menu\AdminMainMenuListener:
        tags:
            - { name: 'kernel.event_listener', event: 'sylius.menu.admin.main', method: 'addTwoFactorItem' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Validator\PasswordPolicyValidator:
        arguments:
            $customerPolicy: '@three_brs.password_policy.customer'
            $adminPolicy: '@three_brs.password_policy.admin'
            $tokenStorage: '@security.token_storage'
        tags:
            - { name: 'validator.constraint_validator', alias: 'three_brs.validator.password_policy' }
