    ThreeBRS\SyliusEnterpriseSecurityPlugin\OAuth\GoogleOAuthProvider:
        arguments:
            $customerEnabled: '%three_brs.oauth.customer.google.enabled%'
            $customerClientId: '%three_brs.oauth.customer.google.client_id%'
            $customerClientSecret: '%three_brs.oauth.customer.google.client_secret%'
            $adminEnabled: '%three_brs.oauth.admin.google.enabled%'
            $adminClientId: '%three_brs.oauth.admin.google.client_id%'
            $adminClientSecret: '%three_brs.oauth.admin.google.client_secret%'
        tags:
            - { name: 'three_brs.oauth_provider' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\OAuth\AppleOAuthProvider:
        arguments:
            $customerEnabled: '%three_brs.oauth.customer.apple.enabled%'
            $customerClientId: '%three_brs.oauth.customer.apple.client_id%'
            $customerTeamId: '%three_brs.oauth.customer.apple.team_id%'
            $customerKeyId: '%three_brs.oauth.customer.apple.key_id%'
            $customerPrivateKeyPath: '%three_brs.oauth.customer.apple.private_key_path%'
            $adminEnabled: '%three_brs.oauth.admin.apple.enabled%'
            $adminClientId: '%three_brs.oauth.admin.apple.client_id%'
            $adminTeamId: '%three_brs.oauth.admin.apple.team_id%'
            $adminKeyId: '%three_brs.oauth.admin.apple.key_id%'
            $adminPrivateKeyPath: '%three_brs.oauth.admin.apple.private_key_path%'
        tags:
            - { name: 'three_brs.oauth_provider' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\OAuth\OAuthProviderRegistry:
        arguments:
            $providers: !tagged_iterator 'three_brs.oauth_provider'

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\ShopSocialLoginHandler:
        arguments:
            $customerRepository: '@sylius.repository.customer'
            $customerFactory: '@sylius.factory.customer'
            $shopUserFactory: '@sylius.factory.shop_user'
            $linkRepository: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\CustomerSocialAccountLinkRepository'
            $entityManager: '@doctrine.orm.entity_manager'

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\AdminSocialLoginHandler:
