services:
    _defaults:
        autowire: false
        autoconfigure: false
        public: false

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Mailer\PasswordChangeEmailManager:
        arguments:
            $emailSender: '@sylius.email_sender'
            $router: '@router'

    ThreeBRS\SyliusEnterpriseSecurityPlugin\EventListener\PasswordChangeNotificationListener:
        arguments:
            $emailManager: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Mailer\PasswordChangeEmailManager'
            $requestStack: '@request_stack'
            $tokenStorage: '@security.token_storage'
            $settings: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Settings\SettingsProvider'
            $logger: '@logger'
        tags:
            - { name: 'doctrine.event_listener', event: 'onFlush' }
            - { name: 'doctrine.event_listener', event: 'postFlush' }

    ThreeBRS\EnterpriseSecurityBundle\PasswordPolicy\PasswordPolicyFilteringValidator:
        arguments:
            $inner: '@ThreeBRS\EnterpriseSecurityBundle\PasswordPolicy\PasswordPolicyFilteringValidator.inner'
        decorates: validator

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\CustomerPasswordHistoryRepository:
        arguments:
            $registry: '@doctrine'
        tags:
            - { name: 'doctrine.repository_service' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\AdminUserPasswordHistoryRepository:
        arguments:
            $registry: '@doctrine'
        tags:
            - { name: 'doctrine.repository_service' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\PasswordHistoryChecker:
        arguments:
            $customerRepository: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\CustomerPasswordHistoryRepository'
            $adminRepository: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\AdminUserPasswordHistoryRepository'

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Validator\PasswordHistoryValidator:
        arguments:
            $checker: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\PasswordHistoryChecker'
            $tokenStorage: '@security.token_storage'
            $settings: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Settings\SettingsProvider'
        tags:
            - { name: 'validator.constraint_validator', alias: 'three_brs.validator.password_history' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\EventListener\ShopUserPasswordHistoryListener:
        arguments:
            $repository: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\CustomerPasswordHistoryRepository'
            $settings: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Settings\SettingsProvider'
            $logger: '@logger'
        tags:
            - { name: 'doctrine.event_listener', event: 'onFlush' }
            - { name: 'doctrine.event_listener', event: 'postFlush' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\EventListener\AdminUserPasswordHistoryListener:
        arguments:
            $repository: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\AdminUserPasswordHistoryRepository'
            $settings: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Settings\SettingsProvider'
            $logger: '@logger'
        tags:
            - { name: 'doctrine.event_listener', event: 'onFlush' }
            - { name: 'doctrine.event_listener', event: 'postFlush' }

    ThreeBRS\EnterpriseSecurityBundle\PasswordExpiration\PasswordExpirationChecker:
        arguments:
            $settings: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Settings\SettingsProvider'

    ThreeBRS\SyliusEnterpriseSecurityPlugin\EventListener\PasswordExpirationListener:
        arguments:
            $tokenStorage: '@security.token_storage'
            $checker: '@ThreeBRS\EnterpriseSecurityBundle\PasswordExpiration\PasswordExpirationChecker'
            $router: '@router'
        tags:
            - { name: 'kernel.event_listener', event: 'kernel.request', method: 'onKernelRequest', priority: 4 }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Controller\Admin\ForcePasswordChangeController:
        arguments:
            $tokenStorage: '@security.token_storage'
            $passwordHasher: '@security.password_hasher'
            $entityManager: '@doctrine.orm.entity_manager'
            $router: '@router'
            $twig: '@twig'
            $formFactory: '@form.factory'
        tags:
            - { name: 'controller.service_arguments' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Form\Extension\AdminUserTypeExtension:
        tags:
            - { name: 'form.type_extension' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Fixture\PasswordHistoryFixture:
        arguments:
            $customerRepository: '@sylius.repository.customer'
            $adminUserRepository: '@sylius.repository.admin_user'
            $entityManager: '@doctrine.orm.entity_manager'
        tags:
            - { name: 'sylius_fixtures.fixture' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Fixture\PasswordExpirationFixture:
        arguments:
            $customerRepository: '@sylius.repository.customer'
            $adminUserRepository: '@sylius.repository.admin_user'
            $entityManager: '@doctrine.orm.entity_manager'
        tags:
            - { name: 'sylius_fixtures.fixture' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Fixture\TwoFactorFixture:
        arguments:
            $customerRepository: '@sylius.repository.customer'
            $adminUserRepository: '@sylius.repository.admin_user'
            $entityManager: '@doctrine.orm.entity_manager'
            $totpGenerator: '@ThreeBRS\EnterpriseSecurityBundle\TwoFactor\TotpSecretGenerator'
            $recoveryGenerator: '@ThreeBRS\EnterpriseSecurityBundle\TwoFactor\RecoveryCodeGenerator'
        tags:
            - { name: 'sylius_fixtures.fixture' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\CustomerRecoveryCodeRepository:
        arguments:
            $registry: '@doctrine'
        tags:
            - { name: 'doctrine.repository_service' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\AdminUserRecoveryCodeRepository:
        arguments:
            $registry: '@doctrine'
        tags:
            - { name: 'doctrine.repository_service' }

    ThreeBRS\EnterpriseSecurityBundle\TwoFactor\TotpSecretGenerator: ~

    ThreeBRS\EnterpriseSecurityBundle\TwoFactor\QrCodeGenerator: ~

    ThreeBRS\EnterpriseSecurityBundle\TwoFactor\RecoveryCodeGenerator: ~

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\RecoveryCodeVerifier:
        arguments:
            $customerRepository: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\CustomerRecoveryCodeRepository'
            $adminRepository: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\AdminUserRecoveryCodeRepository'
            $generator: '@ThreeBRS\EnterpriseSecurityBundle\TwoFactor\RecoveryCodeGenerator'
            $entityManager: '@doctrine.orm.entity_manager'
            $clock: '@clock'

    ThreeBRS\EnterpriseSecurityBundle\TwoFactor\TwoFactorEnforcementChecker:
        arguments:
            $policyFactory: '@ThreeBRS\EnterpriseSecurityBundle\Settings\PolicyFactory'

    ThreeBRS\SyliusEnterpriseSecurityPlugin\EventListener\TwoFactorEnforcementListener:
        arguments:
            $tokenStorage: '@security.token_storage'
            $checker: '@ThreeBRS\EnterpriseSecurityBundle\TwoFactor\TwoFactorEnforcementChecker'
            $router: '@router'
        tags:
            - { name: 'kernel.event_listener', event: 'kernel.request', method: 'onKernelRequest', priority: 3 }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Form\Type\TwoFactorVerifyType:
        tags:
            - { name: 'form.type' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Controller\Shop\TwoFactorSetupController:
        arguments:
            $tokenStorage: '@security.token_storage'
            $totpGenerator: '@ThreeBRS\EnterpriseSecurityBundle\TwoFactor\TotpSecretGenerator'
            $qrGenerator: '@ThreeBRS\EnterpriseSecurityBundle\TwoFactor\QrCodeGenerator'
            $recoveryGenerator: '@ThreeBRS\EnterpriseSecurityBundle\TwoFactor\RecoveryCodeGenerator'
            $csrfTokenManager: '@security.csrf.token_manager'
            $entityManager: '@doctrine.orm.entity_manager'
            $formFactory: '@form.factory'
            $router: '@router'
            $twig: '@twig'
            $translator: '@translator'
            $issuer: '%three_brs.two_factor.issuer%'
            $recoveryCodesEnabled: '%three_brs.two_factor.customer.recovery_codes_enabled%'
            $recoveryCodesCount: '%three_brs.two_factor.customer.recovery_codes_count%'
        tags:
            - { name: 'controller.service_arguments' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Controller\Shop\TwoFactorRecoveryCodesController:
        arguments:
            $tokenStorage: '@security.token_storage'
            $router: '@router'
            $twig: '@twig'
        tags:
            - { name: 'controller.service_arguments' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Controller\Shop\TwoFactorDisableController:
