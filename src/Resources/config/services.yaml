            $entityManager: '@doctrine.orm.entity_manager'
            $recoveryCodeRepository: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\CustomerRecoveryCodeRepository'
            $csrfTokenManager: '@security.csrf.token_manager'
            $router: '@router'
        tags:
            - { name: 'controller.service_arguments' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Controller\Shop\TwoFactorRegenerateRecoveryCodesController:
        arguments:
            $tokenStorage: '@security.token_storage'
            $entityManager: '@doctrine.orm.entity_manager'
            $recoveryCodeRepository: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\CustomerRecoveryCodeRepository'
            $recoveryGenerator: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\RecoveryCodeGenerator'
            $csrfTokenManager: '@security.csrf.token_manager'
            $router: '@router'
            $recoveryCodesEnabled: '%three_brs.two_factor.customer.recovery_codes_enabled%'
            $recoveryCodesCount: '%three_brs.two_factor.customer.recovery_codes_count%'
        tags:
            - { name: 'controller.service_arguments' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Controller\Admin\TwoFactorSetupController:
        arguments:
            $tokenStorage: '@security.token_storage'
            $totpGenerator: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\TotpSecretGenerator'
            $qrGenerator: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\QrCodeGenerator'
            $recoveryGenerator: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\RecoveryCodeGenerator'
            $csrfTokenManager: '@security.csrf.token_manager'
            $entityManager: '@doctrine.orm.entity_manager'
            $formFactory: '@form.factory'
            $router: '@router'
            $twig: '@twig'
            $translator: '@translator'
            $issuer: '%three_brs.two_factor.issuer%'
            $recoveryCodesEnabled: '%three_brs.two_factor.admin.recovery_codes_enabled%'
            $recoveryCodesCount: '%three_brs.two_factor.admin.recovery_codes_count%'
        tags:
            - { name: 'controller.service_arguments' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Controller\Admin\TwoFactorRecoveryCodesController:
        arguments:
            $tokenStorage: '@security.token_storage'
            $router: '@router'
            $twig: '@twig'
        tags:
            - { name: 'controller.service_arguments' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Security\TwoFactorAwareAuthenticationSuccessHandler.shop:
        class: ThreeBRS\SyliusEnterpriseSecurityPlugin\Security\TwoFactorAwareAuthenticationSuccessHandler
        arguments:
            $twoFactorAuthenticationRequiredHandler: '@security.authentication.authentication_required_handler.two_factor.shop'
            $defaultSuccessHandler: '@sylius.authentication.success_handler'
        public: true

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Controller\Admin\TwoFactorDisableController:
        arguments:
            $tokenStorage: '@security.token_storage'
            $entityManager: '@doctrine.orm.entity_manager'
            $recoveryCodeRepository: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\AdminUserRecoveryCodeRepository'
            $csrfTokenManager: '@security.csrf.token_manager'
            $router: '@router'
        tags:
            - { name: 'controller.service_arguments' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Controller\Admin\TwoFactorRegenerateRecoveryCodesController:
        arguments:
            $tokenStorage: '@security.token_storage'
            $entityManager: '@doctrine.orm.entity_manager'
            $recoveryCodeRepository: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\AdminUserRecoveryCodeRepository'
            $recoveryGenerator: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\RecoveryCodeGenerator'
            $csrfTokenManager: '@security.csrf.token_manager'
            $router: '@router'
            $recoveryCodesEnabled: '%three_brs.two_factor.admin.recovery_codes_enabled%'
            $recoveryCodesCount: '%three_brs.two_factor.admin.recovery_codes_count%'
        tags:
            - { name: 'controller.service_arguments' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Controller\Shop\TwoFactorRecoveryChallengeController:
        arguments:
            $tokenStorage: '@security.token_storage'
            $recoveryCodeVerifier: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\RecoveryCodeVerifier'
            $router: '@router'
            $twig: '@twig'
        tags:
            - { name: 'controller.service_arguments' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Controller\Admin\TwoFactorRecoveryChallengeController:
        arguments:
            $tokenStorage: '@security.token_storage'
            $recoveryCodeVerifier: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\RecoveryCodeVerifier'
            $router: '@router'
            $twig: '@twig'
        tags:
            - { name: 'controller.service_arguments' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Menu\ShopAccountMenuListener:
        arguments:
            $passkeyEnabled: '%three_brs.passkey.customer.enabled%'
            $sessionManagementEnabled: '%three_brs.session_management.customer.enabled%'
        tags:
            - { name: 'kernel.event_listener', event: 'sylius.menu.shop.account', method: 'addTwoFactorItem' }
            - { name: 'kernel.event_listener', event: 'sylius.menu.shop.account', method: 'addSocialAccountsItem' }
            - { name: 'kernel.event_listener', event: 'sylius.menu.shop.account', method: 'addPasskeyItem' }
            - { name: 'kernel.event_listener', event: 'sylius.menu.shop.account', method: 'addSessionsItem' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Controller\Shop\SocialAccountsController:
        arguments:
            $twig: '@twig'
        tags:
            - { name: 'controller.service_arguments' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Menu\AdminMainMenuListener:
        arguments:
            $passkeyEnabled: '%three_brs.passkey.admin.enabled%'
            $customerLockoutEnabled: '%three_brs.account_lockout.customer.enabled%'
            $adminLockoutEnabled: '%three_brs.account_lockout.admin.enabled%'
            $sessionManagementEnabled: '%three_brs.session_management.admin.enabled%'
        tags:
            - { name: 'kernel.event_listener', event: 'sylius.menu.admin.main', method: 'addTwoFactorItem' }
            - { name: 'kernel.event_listener', event: 'sylius.menu.admin.main', method: 'addSocialAccountsItem' }
            - { name: 'kernel.event_listener', event: 'sylius.menu.admin.main', method: 'addPasskeyItem' }
            - { name: 'kernel.event_listener', event: 'sylius.menu.admin.main', method: 'addLockedCustomersItem' }
            - { name: 'kernel.event_listener', event: 'sylius.menu.admin.main', method: 'addLockedAdminsItem' }
            - { name: 'kernel.event_listener', event: 'sylius.menu.admin.main', method: 'addSessionsItem' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Controller\Admin\SocialAccountsController:
