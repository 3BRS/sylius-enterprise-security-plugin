    ThreeBRS\SyliusEnterpriseSecurityPlugin\EventListener\AdminIpBlacklistListener:
        arguments:
            $checker: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\IpBlacklist\IpBlacklistChecker'
            # See the whitelist listener above: '/admin' is a default, not a guarantee.
            $adminPathPrefix: '/%sylius_admin.path_name%'
        tags:
            # Priority 20 — above the firewall (8), above RateLimitListener (16) and
            # above the whitelist's pre-auth pass (18), so a blacklist hit still wins
            # over any allow decision and a denied address never reaches the
            # authenticator on /admin/login-check or /admin/2fa_check. The check needs
            # only the path and the client address, so it does not depend on anything
            # the firewall or the router sets up.
            - { name: 'kernel.event_listener', event: 'kernel.request', method: 'onKernelRequest', priority: 20 }

