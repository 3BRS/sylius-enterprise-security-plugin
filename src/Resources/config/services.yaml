    ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\AdminUserIpWhitelistRepositoryInterface:
        alias: ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\AdminUserIpWhitelistRepository

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\IpWhitelist\IpWhitelistChecker:
        arguments:
            $settingsProvider: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Settings\SettingsProvider'
            $adminWhitelistRepository: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\AdminUserIpWhitelistRepository'
            $cidrMatcher: '@ThreeBRS\EnterpriseSecurityBundle\IpWhitelist\CidrMatcher'

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\IpWhitelist\IpWhitelistCheckerInterface:
        alias: ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\IpWhitelist\IpWhitelistChecker

    ThreeBRS\SyliusEnterpriseSecurityPlugin\EventListener\AdminIpWhitelistListener:
        arguments:
            $checker: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\IpWhitelist\IpWhitelistChecker'
            $tokenStorage: '@security.token_storage'
            # Sylius derives the admin prefix from an env var, so the constructor default
            # of '/admin' only matches an installation that left it alone. Anywhere it was
            # renamed the listener would look at a path that never occurs and let every
            # address through without a word.
            $adminPathPrefix: '/%sylius_admin.path_name%'
        tags:
            # Two passes, because the decision has two halves and they need different
            # positions relative to the firewall (priority 8).
            #
            # Priority 18 — above the firewall and above RateLimitListener (16), so an
            # address no entry covers is turned away before the authenticator answers
            # /admin/login-check itself and before it can spend anyone's rate-limit
            # budget. Only the identity-independent half runs here; token storage is
            # still empty.
            - { name: 'kernel.event_listener', event: 'kernel.request', method: 'onKernelRequestPreAuth', priority: 18 }
            # Priority 4 — below the firewall, where the authenticated admin is known
            # and the check narrows to that admin's own entry.
            - { name: 'kernel.event_listener', event: 'kernel.request', method: 'onKernelRequest', priority: 4 }

