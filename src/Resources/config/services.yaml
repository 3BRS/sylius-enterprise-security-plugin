            $router: '@router'
            $twig: '@twig'
            $linkRepository: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\CustomerSocialAccountLinkRepository'
            $logger: '@logger'
        tags:
            - { name: 'controller.service_arguments' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Controller\Shop\SocialAccountUnlinkController:
        arguments:
            $security: '@security.helper'
            $linkRepository: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Repository\CustomerSocialAccountLinkRepository'
            $guard: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\Service\LastAuthMethodGuard'
            $entityManager: '@doctrine.orm.entity_manager'
            $csrfTokenManager: '@security.csrf.token_manager'
            $router: '@router'
            $logger: '@logger'
        tags:
            - { name: 'controller.service_arguments' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Controller\Admin\OAuthInitiateController:
        arguments:
            $registry: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\OAuth\OAuthProviderRegistry'
            $router: '@router'
        tags:
            - { name: 'controller.service_arguments' }

    ThreeBRS\SyliusEnterpriseSecurityPlugin\Controller\Admin\OAuthCallbackController:
        arguments:
            $registry: '@ThreeBRS\SyliusEnterpriseSecurityPlugin\OAuth\OAuthProviderRegistry'
